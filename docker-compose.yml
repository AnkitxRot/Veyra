# CloudeeeIDE single-node production stack.
#
# The app manages sandboxes through the HOST Docker daemon via the mounted
# socket (Docker-out-of-Docker). It does not run Docker-in-Docker.
#
# Before `docker compose up`, build the sandbox runner image on the host daemon:
#   npm run runner:build        (or: docker build -t cloudeeeide-runner:latest -f docker/Dockerfile.runner .)
#
# Persistent state lives under DATA_DIR (default /var/lib/cloud-ide) and MUST be
# bind-mounted at the same path inside and outside the container, because the
# backend passes those host paths to `docker run -v` for sandbox workspaces.

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
      args:
        # Match the host docker group for non-root socket access on a VPS:
        #   DOCKER_GID=$(getent group docker | cut -d: -f3) docker compose build
        DOCKER_GID: "${DOCKER_GID:-999}"
    image: cloudeeeide-app:latest
    container_name: cloudeeeide-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /var/lib/cloud-ide
      APP_CONTAINERIZED: "1"
      TRUST_PROXY: "1"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env before first deploy (required until an admin account exists)}"
      MAX_SANDBOXES: "${MAX_SANDBOXES:-20}"
      PROJECT_QUOTA: "${PROJECT_QUOTA:-20}"
      MAX_CONCURRENT_RUNS: "${MAX_CONCURRENT_RUNS:-3}"
      SANDBOX_IDLE_TIMEOUT_MS: "${SANDBOX_IDLE_TIMEOUT_MS:-1800000}"
      # M47: only needed if projects use encrypted secrets. See deploy/README.md.
      SECRETS_MASTER_KEY: "${SECRETS_MASTER_KEY:-}"
    ports:
      - "${HTTP_PORT:-3000}:3000"
    volumes:
      # Path-identity mount: the host path MUST equal the container path. The
      # backend passes /var/lib/cloud-ide/workspaces/<id> to `docker run -v`,
      # and the host daemon resolves that path on the host filesystem.
      - /var/lib/cloud-ide:/var/lib/cloud-ide
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
