name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint, typecheck, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Whitespace check
        run: git diff --check
      - run: npm run lint -w @cloud-ide/backend
      - run: npm run lint -w @cloud-ide/frontend
      - run: npm run typecheck -w @cloud-ide/backend

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The frontend bundles the full monaco-editor package (see
      # frontend/vite.config.ts); tsc + vite build peak at ~2.9GB of Node
      # working set, above V8's default ~2GB old-space ceiling. 4096MB leaves
      # headroom on the 7GB runner. Scoped to this step only.
      - name: Typecheck + build
        run: npm run build -w @cloud-ide/frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Tests
        run: npm test -w @cloud-ide/frontend
        env:
          CI: "true"

  backend:
    name: Backend tests (Docker, browser E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Provision sandbox execution user (mirrors scripts/setup.sh for a real deployment host)
        run: sudo useradd -o -r -m -s /bin/bash -u 1000 ide
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The runner image is required for the Docker-dependent backend tests.
      - name: Build sandbox runner image
        run: docker build -t cloudeeeide-runner:latest -f docker/Dockerfile.runner .
      # Chromium is required for M82/M83 real-browser E2E (LSP + debugger).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Tests
        run: npm test -w @cloud-ide/backend
        env:
          CI: "true"

  image:
    name: Application image build and scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        run: docker build -t cloudeeeide-app:ci -f docker/Dockerfile.app .
      - name: Scan image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cloudeeeide-app:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
