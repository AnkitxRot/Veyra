name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision sandbox execution user (mirrors scripts/setup.sh for a real deployment host)
        run: sudo useradd -o -r -m -s /bin/bash -u 1000 ide

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Whitespace check
        run: git diff --check

      - name: Backend lint
        run: npm run lint -w @cloud-ide/backend

      - name: Frontend lint
        run: npm run lint -w @cloud-ide/frontend

      - name: Backend typecheck
        run: npm run typecheck -w @cloud-ide/backend

      # The frontend bundles the full monaco-editor package (see
      # frontend/vite.config.ts), which makes both `tsc --noEmit` and the
      # Rollup/esbuild transform pass in `vite build` genuinely memory-heavy —
      # measured locally at ~2.9GB peak Node working set for a normal
      # successful build. V8's default old-space ceiling (~2GB) is lower than
      # that on this runner, so the build was hitting a V8-internal limit, not
      # the runner's actual RAM. This runner (private-repo ubuntu-latest) has
      # 2 vCPU / 7GB RAM total; 4096MB leaves ~1GB of headroom above the
      # measured natural peak while using at most ~58% of total runner RAM.
      # Scoped to this step only so local `npm run build` behavior for
      # developers is unaffected.
      - name: Frontend typecheck + build
        run: npm run build -w @cloud-ide/frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Frontend tests
        run: npm test -w @cloud-ide/frontend
        env:
          CI: "true"

      # The runner image is required for the Docker-dependent backend tests.
      - name: Build sandbox runner image
        run: docker build -t cloudeeeide-runner:latest -f docker/Dockerfile.runner .

      # Chromium is required for M82 real-browser language-intelligence E2E.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Backend tests (includes Docker execution/lifecycle tests)
        run: npm test -w @cloud-ide/backend
        env:
          CI: "true"

      # Gate on the production application image building cleanly.
      - name: Build application image
        run: docker build -t cloudeeeide-app:ci -f docker/Dockerfile.app .
